[project]
name = "incremental-build-engine"
version = "0.1.0"
description = "An incremental build system built around content, not clocks"
requires-python = ">=3.11"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "B", "UP", "SIM", "RET", "ARG", "PL", "RUF",
]
ignore = [
    "N818",
    "PLR2004",
    "PLR0913",
    "PLR0912",
    "PLR0911",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "ARG002"]
"forge/cli.py" = ["PLC0415"]
